<div *transloco="let t" class="flex flex-col gap-4">
  @if (mode === 'error') {
    <lg-message severity="danger">{{ t('bugReport.errorIntro') }}</lg-message>
  } @else {
    <p>{{ t('bugReport.intro') }}</p>
  }

  @if (error) {
    <details
      class="rounded-md border border-border bg-surface-50 dark:bg-surface-800"
    >
      <summary class="cursor-pointer px-3 py-2 text-sm font-medium">
        {{ t('bugReport.errorDetails') }}
      </summary>
      <div class="border-t border-border px-3 py-2">
        <p class="text-xs font-medium break-words">{{ error.message }}</p>
        @if (error.stack) {
          <pre
            class="mt-2 max-h-48 overflow-auto text-xs whitespace-pre-wrap break-words text-muted"
            >{{ error.stack }}</pre>
        }
      </div>
    </details>
  }

  <textarea
    lgTextarea
    rows="6"
    class="w-full"
    [maxlength]="maxLength"
    [placeholder]="t('bugReport.placeholder')"
    [ngModel]="message()"
    [ngModelOptions]="{ standalone: true }"
    (ngModelChange)="message.set($event)"
  ></textarea>

  <p class="text-xs text-muted">{{ t('bugReport.dataNotice') }}</p>

  <div class="flex justify-end gap-2">
    <lg-button
      severity="secondary"
      [outlined]="true"
      [label]="t('bugReport.cancel')"
      (onClick)="cancel()"
    />
    <lg-button
      [label]="t('bugReport.send')"
      [disabled]="!canSend()"
      (onClick)="send()"
    />
  </div>
</div>
