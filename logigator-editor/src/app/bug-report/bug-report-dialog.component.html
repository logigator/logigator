<div *appTranslate="let t" class="flex flex-col gap-4">
  @if (mode === 'error') {
    <lg-message severity="danger">{{ t('bugReport.errorIntro') }}</lg-message>
  } @else {
    <p>{{ t('bugReport.intro') }}</p>
  }

  <!-- A control, not an `<a href>`: the hand-off has to pass through
  `LegacyEditorService` to be reported, and a link's context menu bypasses any
  click handler. -->
  <p class="text-sm text-muted">
    {{ t('bugReport.legacyEditorNotice') }}
    <button
      type="button"
      class="cursor-pointer text-primary hover:underline"
      (click)="openLegacyEditor()"
    >
      {{ t('bugReport.legacyEditorLink') }}
    </button>
  </p>

  @if (error) {
    <details
      class="rounded-md border border-border bg-surface-50 dark:bg-surface-800"
    >
      <summary class="cursor-pointer px-3 py-2 text-sm font-medium">
        {{ t('bugReport.errorDetails') }}
      </summary>
      <div class="border-t border-border px-3 py-2">
        <p class="text-xs font-medium break-words">{{ error.message }}</p>
        @if (error.stack) {
          <pre
            class="mt-2 max-h-48 overflow-auto text-xs whitespace-pre-wrap break-words text-muted"
            >{{ error.stack }}</pre>
        }
      </div>
    </details>
  }

  <textarea
    lgTextarea
    rows="6"
    class="w-full"
    [maxlength]="maxLength"
    [placeholder]="t('bugReport.placeholder')"
    [ngModel]="message()"
    [ngModelOptions]="{ standalone: true }"
    (ngModelChange)="message.set($event)"
  ></textarea>

  <p class="text-xs text-muted">{{ t('bugReport.dataNotice') }}</p>

  <div class="flex justify-end gap-2">
    <button
      lgButton
      severity="secondary"
      [outlined]="true"
      (onClick)="cancel()"
    >
      {{ t('bugReport.cancel') }}
    </button>
    <button lgButton [disabled]="!canSend()" (onClick)="send()">
      {{ t('bugReport.send') }}
    </button>
  </div>
</div>
