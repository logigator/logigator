<ng-container *appTranslate="let t">
  <div class="flex flex-col gap-2">
    @for (group of groups; track group.labelKey; let last = $last) {
      <div>
        <h3 class="text-sm font-semibold uppercase text-muted mb-2">
          {{ t(group.labelKey) }}
        </h3>
        @for (action of group.actions; track action) {
          <div class="flex items-center justify-between py-2 px-1 rounded">
            <span class="text-sm">{{ t(`shortcuts.actions.${action}`) }}</span>
            <div class="flex items-center gap-1">
              <app-shortcut-edit
                [binding]="shortcutService.binding(action)()"
                [allowModifierOnly]="allowsModifierOnly(action)"
                (bindingChange)="onBindingChange(action, $event)"
              />
              <button
                lgButton
                disabledInteractive
                icon="ph ph-arrow-counter-clockwise"
                severity="secondary"
                [text]="true"
                size="sm"
                [disabled]="isDefault(action)"
                [lgTooltip]="t('shortcuts.manager.reset')"
                [ariaLabel]="t('shortcuts.manager.reset')"
                tooltipPosition="bottom"
                (onClick)="shortcutService.resetBinding(action)"
              ></button>
              <button
                lgButton
                disabledInteractive
                icon="ph ph-trash"
                severity="secondary"
                [text]="true"
                size="sm"
                [disabled]="!shortcutService.binding(action)()"
                [lgTooltip]="t('shortcuts.manager.unassign')"
                [ariaLabel]="t('shortcuts.manager.unassign')"
                tooltipPosition="bottom"
                (onClick)="shortcutService.setBinding(action, null)"
              ></button>
            </div>
          </div>
        }
      </div>
      @if (!last) {
        <lg-divider class="my-4" />
      }
    }
  </div>

  <div class="flex justify-end mt-4">
    <button lgButton severity="danger" [outlined]="true" (onClick)="resetAll()">
      {{ t('shortcuts.manager.resetAll') }}
    </button>
  </div>
</ng-container>
