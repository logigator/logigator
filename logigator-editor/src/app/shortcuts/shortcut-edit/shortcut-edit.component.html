<div
  class="flex flex-wrap items-center justify-end gap-1"
  *appTranslate="let t"
>
  <ng-template #prompt>
    <span class="inline-flex items-center rounded-md bg-content-hover">
      <span class="py-1 pr-0.5 pl-1.25 text-xs leading-5.5 italic text-muted">{{
        t('shortcuts.manager.recordPrompt')
      }}</span>
      <button
        lgButton
        class="min-h-0! min-w-0! self-stretch rounded-l-none! py-1! pr-1! pl-px! text-xs!"
        icon="ph ph-x"
        severity="secondary"
        [text]="true"
        size="sm"
        [lgTooltip]="t('shortcuts.manager.cancelRecording')"
        [ariaLabel]="t('shortcuts.manager.cancelRecording')"
        tooltipPosition="bottom"
        (onClick)="stopRecording()"
      ></button>
    </span>
  </ng-template>

  @for (binding of bindings(); track $index; let i = $index) {
    @if (recordingIndex() === i) {
      <ng-container [ngTemplateOutlet]="prompt" />
    } @else {
      <span class="inline-flex items-center rounded-md bg-content-hover">
        <button
          lgButton
          class="min-h-0! min-w-0! rounded-r-none! py-1! pr-0.5! pl-1!"
          severity="secondary"
          [text]="true"
          size="sm"
          [lgTooltip]="t('shortcuts.manager.change', { key: label(binding) })"
          [ariaLabel]="t('shortcuts.manager.change', { key: label(binding) })"
          tooltipPosition="bottom"
          (onClick)="startRecording(i)"
        >
          <lg-shortcut [binding]="binding" />
        </button>
        <button
          lgButton
          class="min-h-0! min-w-0! self-stretch rounded-l-none! py-1! pr-1! pl-px! text-xs!"
          icon="ph ph-x"
          severity="secondary"
          [text]="true"
          size="sm"
          [lgTooltip]="t('shortcuts.manager.remove', { key: label(binding) })"
          [ariaLabel]="t('shortcuts.manager.remove', { key: label(binding) })"
          tooltipPosition="bottom"
          (onClick)="remove(i)"
        ></button>
      </span>
    }
  } @empty {
    @if (!isRecording()) {
      <span class="px-1.25 text-xs text-muted">{{
        t('shortcuts.manager.notSet')
      }}</span>
    }
  }

  @if (recordingIndex() === bindings().length) {
    <ng-container [ngTemplateOutlet]="prompt" />
  }
  <button
    lgButton
    icon="ph ph-plus"
    severity="secondary"
    [text]="true"
    size="sm"
    [lgTooltip]="t('shortcuts.manager.add')"
    [ariaLabel]="t('shortcuts.manager.add')"
    tooltipPosition="bottom"
    (onClick)="startRecording(bindings().length)"
  ></button>
  <ng-content />
</div>
