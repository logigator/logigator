<div *appTranslate="let t">
  <button
    lgButton
    class="float-right"
    size="sm"
    severity="secondary"
    (onClick)="open()"
  >
    {{ t(option().label) }}
  </button>

  <lg-dialog
    [visible]="dialogVisible()"
    (visibleChange)="$event ? null : cancel()"
    [header]="t(option().dialogTitle)"
    [modal]="true"
    [dismissableMask]="false"
    [style]="{ width: '40rem' }"
  >
    <textarea
      lgTextarea
      rows="12"
      class="w-full"
      [maxlength]="option().maxLength"
      [placeholder]="option().placeholder ? t(option().placeholder!) : ''"
      [ngModel]="draft()"
      [ngModelOptions]="{ standalone: true }"
      (ngModelChange)="draft.set($event)"
    ></textarea>

    <ng-template #footer>
      <button lgButton severity="secondary" (onClick)="cancel()">
        {{ t('common.cancel') }}
      </button>
      <button lgButton (onClick)="save()">{{ t('common.save') }}</button>
    </ng-template>
  </lg-dialog>
</div>
