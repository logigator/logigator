<div *appTranslate="let t">
  <lg-button
    class="float-right"
    [label]="t(option().label)"
    size="sm"
    severity="secondary"
    (onClick)="open()"
  ></lg-button>

  <lg-dialog
    [visible]="dialogVisible()"
    (visibleChange)="$event ? null : cancel()"
    [header]="t(option().dialogTitle)"
    [modal]="true"
    [dismissableMask]="false"
    [style]="{ width: '40rem' }"
  >
    <textarea
      lgTextarea
      rows="12"
      class="w-full"
      [maxlength]="option().maxLength"
      [placeholder]="option().placeholder ? t(option().placeholder!) : ''"
      [ngModel]="draft()"
      [ngModelOptions]="{ standalone: true }"
      (ngModelChange)="draft.set($event)"
    ></textarea>

    <ng-template #footer>
      <lg-button
        [label]="t('common.cancel')"
        severity="secondary"
        (onClick)="cancel()"
      ></lg-button>
      <lg-button [label]="t('common.save')" (onClick)="save()"></lg-button>
    </ng-template>
  </lg-dialog>
</div>
