<div class="flex gap-4 items-center justify-between" *transloco="let t">
  <label [for]="inputId">{{ t(option().label) }}</label>
  <input
    lgInputText
    [id]="inputId"
    type="text"
    size="sm"
    [maxlength]="option().maxLength ?? null"
    [placeholder]="option().placeholder ? t(option().placeholder!) : ''"
    [ngModel]="option().value"
    [ngModelOptions]="{ standalone: true }"
    (ngModelChange)="commit()($event)"
  />
</div>
