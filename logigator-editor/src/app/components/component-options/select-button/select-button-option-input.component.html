<div class="flex gap-4 items-center justify-between" *transloco="let t">
  <span [id]="labelId">{{ t(option().label) }}</span>
  <lg-select-button
    [ariaLabelledby]="labelId"
    optionLabel="label"
    optionValue="value"
    optionIcon="icon"
    [allowEmpty]="false"
    [options]="option().options"
    [ngModel]="option().value"
    [ngModelOptions]="{ standalone: true }"
    (ngModelChange)="commit()($event)"
  />
</div>
