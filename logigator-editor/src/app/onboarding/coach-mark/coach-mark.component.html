<div
  *appTranslate="let t"
  class="pointer-events-auto relative flex w-72 max-w-[calc(100vw-2rem)] flex-col gap-2 rounded-lg border border-border bg-content p-4 shadow-lg"
  role="dialog"
  aria-live="polite"
>
  @if (side(); as s) {
    <lg-caret [side]="s" />
  }

  <div class="flex items-start justify-between gap-2">
    <h3 class="text-sm font-semibold">{{ view().title }}</h3>
    <span class="shrink-0 text-xs text-muted tabular-nums">
      {{ view().stepNumber }} / {{ view().totalSteps }}
    </span>
  </div>

  <!-- Body carries our own translated markup (e.g. <strong>); trusted content. -->
  <p class="text-sm text-muted" [innerHTML]="view().text"></p>

  <div class="flex items-center justify-between gap-2 pt-1">
    @if (!view().isFinal) {
      <lg-button
        size="sm"
        severity="secondary"
        text
        [label]="t('onboarding.bubble.skip')"
        (onClick)="skip.emit()"
      ></lg-button>
    }
    @if (view().showNext) {
      <lg-button
        size="sm"
        class="ml-auto"
        [label]="
          t(
            view().isFinal
              ? 'onboarding.bubble.finish'
              : 'onboarding.bubble.next'
          )
        "
        (onClick)="next.emit()"
      ></lg-button>
    }
  </div>
</div>
