<ng-container *transloco="let t">
  @if (collapsed()) {
    <div class="rounded-full bg-content p-1.5 shadow-lg">
      <lg-button
        icon="ph ph-map-trifold"
        severity="secondary"
        rounded
        [ariaLabel]="t('minimap.expand')"
        (onClick)="toggleCollapsed()"
      ></lg-button>
    </div>
  } @else {
    <div
      class="relative overflow-hidden rounded-lg border border-border shadow-lg backdrop-blur-sm hover:bg-content transition-colors"
      [class]="scrubbing() ? 'bg-content' : 'bg-content/50'"
    >
      <div
        #map
        aria-hidden="true"
        class="relative touch-none select-none"
        [class.cursor-grabbing]="scrubbing()"
        [style.width.px]="panelSize().width"
        [style.height.px]="panelSize().height"
        (pointerdown)="onPointerDown($event)"
        (pointermove)="onPointerMove($event)"
        (pointerup)="onPointerUp($event)"
        (pointercancel)="onPointerUp($event)"
      >
        <canvas #canvas class="absolute inset-0 h-full w-full"></canvas>
        <div
          #rect
          class="absolute left-0 top-0 rounded border border-primary bg-muted/10"
          [class.cursor-grab]="!scrubbing()"
        ></div>
      </div>
      <lg-button
        class="absolute right-2 top-2"
        styleClass="shadow-md"
        icon="ph ph-arrows-in-simple"
        severity="secondary"
        size="sm"
        rounded
        [ariaLabel]="t('minimap.collapse')"
        (onClick)="toggleCollapsed()"
      ></lg-button>
    </div>
  }
</ng-container>
