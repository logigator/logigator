<canvas
  #canvas
  class="absolute inset-0 h-full w-full touch-none transition-opacity duration-150 ease-out"
  [class.opacity-0]="!loaded()"
  [class.cursor-grab]="cursor() === 'grab'"
  [class.cursor-grabbing]="cursor() === 'grabbing'"
></canvas>
@if (editorSettings.fpsCounter.value() && loaded()) {
  <app-fps-counter [ticker]="ticker" />
}
