<lg-menubar [model]="items()" class="bg-primary-400 text-surface-900">
  <ng-template #start>
    <a class="relative w-40 h-8" href="/" target="_blank" rel="noopener">
      <img [ngSrc]="logoUrl" alt="Logo" fill loading="eager" />
    </a>
    @if (editing()) {
      <span class="ml-2 flex items-center gap-1" *appTranslate="let t">
        <input
          #renameInput
          lgInputText
          class="text-xl font-bold"
          type="text"
          [maxlength]="nameMaxLength"
          [ngModel]="editValue()"
          (ngModelChange)="editValue.set($event)"
          (click)="$event.stopPropagation()"
          (keydown)="$event.stopPropagation()"
          (keydown.enter)="commitRename()"
          (keydown.escape)="cancelRename()"
          (blur)="commitRename()"
        />
        <button
          lgButton
          icon="ph ph-x"
          class="text-surface-900!"
          [text]="true"
          [ariaLabel]="t('titleBar.rename.cancel')"
          [lgTooltip]="t('titleBar.rename.cancel')"
          tooltipPosition="bottom"
          (mousedown)="$event.preventDefault()"
          (click)="cancelRename()"
        ></button>
      </span>
    } @else {
      <span class="ml-2 flex items-center gap-1" *appTranslate="let t">
        <h1 class="text-xl font-bold">{{ projectName() }}</h1>
        @if (canRename()) {
          <button
            lgButton
            icon="ph ph-pencil-simple"
            class="text-surface-900!"
            size="sm"
            [text]="true"
            [ariaLabel]="t('titleBar.rename.label')"
            [lgTooltip]="t('titleBar.rename.label')"
            tooltipPosition="bottom"
            (click)="startRename()"
          ></button>
        }
      </span>
    }
    @if (sourceChip(); as source) {
      <app-source-indicator
        *appTranslate="let t"
        [source]="source"
        [serverTitle]="t('sourceIndicator.cloudTitle')"
        [browserTitle]="t('sourceIndicator.localTitle')"
        [draftTitle]="t('sourceIndicator.draftTitle')"
        [shareTitle]="t('sourceIndicator.shareTitle')"
      />
    }
    @if (forkTitle(); as title) {
      <lg-badge
        *appTranslate="let t"
        rounded
        severity="secondary"
        [title]="title"
      >
        <i class="ph ph-git-fork"></i>
        {{ t('titleBar.fork.label') }}
      </lg-badge>
    }
  </ng-template>
  <ng-template #end>
    <app-user-settings />
  </ng-template>
</lg-menubar>
