<div class="grid gap-2 grid-cols-[repeat(auto-fill,minmax(3.5rem,1fr))]">
  @for (comp of components(); track comp.type) {
    @let selected = selectedComponent() === comp.type;
    <button
      type="button"
      [appOnboardTarget]="'palette-item-' + comp.type"
      class="relative w-full group flex flex-col items-center gap-1 rounded-md cursor-pointer outline-none focus-visible:ring-2 focus-visible:ring-primary"
      [attr.aria-pressed]="selected"
      (click)="selectComponent(comp)"
    >
      <span
        class="relative flex justify-center items-center w-full aspect-square rounded-md border bg-content-hover text-text font-mono font-semibold transition-colors group-hover:border-primary"
        [class]="
          selected ? 'border-primary ring-1 ring-primary' : 'border-border'
        "
      >
        @if (comp.symbolShape; as shape) {
          <app-component-symbol class="absolute inset-3" [shape]="shape" />
        } @else {
          {{ comp.symbol }}
        }
        @if (comp.source; as source) {
          <app-source-indicator [source]="source" variant="badge" />
        }
        <!-- On the top edge just right of the source badge, reading as its
             sibling. Not the right edge: that overhang would land on the next
             tile's source badge, and the corner holds the selected marker. -->
        @if (outdatedCount(comp.type); as count) {
          <span
            class="absolute -top-1.5 left-3 flex items-center justify-center w-4 h-4 rounded-full bg-content border border-border"
            [title]="outdatedTitle(count)"
          >
            <i
              class="ph ph-arrow-circle-up text-warn-text text-[0.6rem]"
              aria-hidden="true"
            ></i>
          </span>
        }
        @if (selected) {
          <span
            class="absolute -top-px -right-px w-5 h-5 overflow-hidden rounded-tr-md"
          >
            <span
              class="absolute inset-0 flex items-start justify-end pt-0.5 pr-0.5 bg-primary text-surface-950 [clip-path:polygon(100%_0,100%_100%,0_0)]"
            >
              <i class="ph ph-check text-[0.5rem]" aria-hidden="true"></i>
            </span>
          </span>
        }
      </span>
      <span
        class="block text-center text-xs max-w-full text-ellipsis overflow-hidden"
        [class]="selected ? 'text-primary' : 'text-muted'"
      >
        {{ text(comp.name) }}
      </span>
    </button>
  }
</div>
