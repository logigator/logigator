<div *transloco="let t" class="flex border-t border-border">
  <!-- min-w-0 lets the grow cell shrink below its content so the mode hint
       truncates instead of wrapping the whole bar. -->
  <div class="grow min-w-0 truncate px-2 border-r border-white/20">
    {{
      t(workMode(), {
        componentName: text(selectedComponentName()),
        scissorKey: scissorKeyLabel()
      })
    }}
  </div>
  <div class="shrink-0 whitespace-nowrap px-2 border-r border-white/20">
    {{ boardPositionFormatted() }}
  </div>
  <div class="shrink-0 whitespace-nowrap px-2 border-r border-white/20">
    {{ dirty() ? t('statusBar.unsaved') : t('statusBar.saved') }}
  </div>
  <div class="shrink-0 whitespace-nowrap px-2">
    {{ t('statusBar.selected') }}: {{ selectionCount() }}
  </div>
</div>
