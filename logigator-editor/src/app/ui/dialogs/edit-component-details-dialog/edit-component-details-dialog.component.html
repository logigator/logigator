<form *appTranslate="let t" class="flex flex-col gap-4" (ngSubmit)="save()">
  <div class="flex flex-col gap-1">
    <label for="edit-component-name">{{
      t('editComponentDetails.name')
    }}</label>
    <input
      lgInputText
      id="edit-component-name"
      type="text"
      maxlength="20"
      [ngModel]="name()"
      (ngModelChange)="name.set($event)"
      [ngModelOptions]="{ standalone: true }"
    />
  </div>
  <div class="flex flex-col gap-1">
    <label for="edit-component-symbol">{{
      t('editComponentDetails.symbol')
    }}</label>
    <input
      lgInputText
      id="edit-component-symbol"
      type="text"
      maxlength="5"
      [ngModel]="symbol()"
      (ngModelChange)="symbol.set($event)"
      [ngModelOptions]="{ standalone: true }"
    />
  </div>
  <div class="flex flex-col gap-1">
    <label
      id="edit-component-description-label"
      for="edit-component-description"
      >{{ t('editComponentDetails.description') }}</label
    >
    <lg-markdown-field
      [value]="description()"
      [maxLength]="descriptionMaxLength"
      labelledBy="edit-component-description-label"
    >
      <textarea
        lgTextarea
        id="edit-component-description"
        rows="7"
        class="w-full"
        [attr.maxlength]="descriptionMaxLength"
        [ngModel]="description()"
        (ngModelChange)="description.set($event)"
        [ngModelOptions]="{ standalone: true }"
      ></textarea>
    </lg-markdown-field>
  </div>
  <p class="text-sm text-muted">
    {{ t('editComponentDetails.frozenInstancesHint') }}
  </p>
  <div class="flex justify-end">
    <button lgButton type="submit" [disabled]="!canSave">
      {{ t('editComponentDetails.save') }}
    </button>
  </div>
</form>
