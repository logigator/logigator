<div *appTranslate="let t" class="flex flex-col gap-4">
  <p>{{ t('logoutDialog.message') }}</p>

  <lg-list>
    @for (item of items; track item.name) {
      <lg-list-item leadingIcon="ph ph-file">
        {{ item.name }}
        @if (item.lastEditedAt) {
          <ng-template #subtitle>
            {{
              t('logoutDialog.edited', {
                relative: item.lastEditedAt | relativeTime
              })
            }}
          </ng-template>
        }
      </lg-list-item>
    }
  </lg-list>

  @if (promotionWarning) {
    <lg-message severity="warn">{{ promotionWarning }}</lg-message>
  }

  <div class="flex justify-end gap-2">
    <button lgButton severity="danger" [outlined]="true" (onClick)="discard()">
      {{ t('logoutDialog.discard') }}
    </button>
    <button
      lgButton
      severity="secondary"
      [outlined]="true"
      (onClick)="cancel()"
    >
      {{ t('logoutDialog.cancel') }}
    </button>
    <button lgButton (onClick)="save()">{{ t('logoutDialog.save') }}</button>
  </div>
</div>
