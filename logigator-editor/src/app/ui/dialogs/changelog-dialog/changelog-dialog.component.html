<div *appTranslate="let t" class="flex flex-col gap-4">
  @if (releases(); as releases) {
    <div class="max-h-[60vh] overflow-y-auto pr-1">
      @for (release of releases; track release.version) {
        <section
          class="flex flex-col gap-3 border-border py-6 first:pt-0 last:pb-0 not-first:border-t"
        >
          <div>
            <h3 class="font-mono text-lg font-bold text-text-hover">
              {{ release.version }}
            </h3>
            <time class="text-sm text-muted" [attr.datetime]="release.date">
              {{ release.dateLabel }}
            </time>
          </div>

          <lg-markdown class="min-w-0" [data]="release.body" />
        </section>
      }
    </div>
  } @else if (failed()) {
    <p class="text-muted text-sm">{{ t('changelogDialog.loadError') }}</p>
  } @else {
    <p class="text-muted text-sm">{{ t('changelogDialog.loading') }}</p>
  }

  <div class="flex justify-end">
    <button lgButton (onClick)="close()">
      {{ t('changelogDialog.close') }}
    </button>
  </div>
</div>
