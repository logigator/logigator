<div *appTranslate="let t">
  <lg-tabs [value]="activeTab()" (valueChange)="onTabChange($event)">
    <lg-tab value="local">{{ t('openProjectDialog.localProjects') }}</lg-tab>
    <lg-tab value="server">{{ t('openProjectDialog.cloudProjects') }}</lg-tab>
    <lg-tab value="file">{{ t('openProjectDialog.fromFile') }}</lg-tab>

    <!-- Local Projects -->
    <lg-tab-panel value="local">
      <app-project-list
        [items]="localItems()"
        [loading]="loadingLocal()"
        [page]="localPage()"
        [totalItems]="localTotal()"
        [showUpload]="true"
        (open)="openLocalProject($event)"
        (delete)="deleteLocalConfirmed($event)"
        (rename)="renameLocal($event)"
        (upload)="uploadLocal($event)"
        (pageChange)="localPage.set($event)"
        (searchChange)="onLocalSearch($event)"
      />
    </lg-tab-panel>

    <!-- Server Projects -->
    <lg-tab-panel value="server">
      @if (!userService.user()) {
        <lg-message centered class="py-12">
          {{ t('openProjectDialog.notLoggedIn') }}
        </lg-message>
      } @else {
        <app-project-list
          [items]="serverItems()"
          [loading]="loadingServer()"
          [page]="serverPage()"
          [totalItems]="serverTotal()"
          [showShare]="true"
          (open)="openServerProject($event)"
          (delete)="deleteServerConfirmed($event)"
          (rename)="renameServer($event)"
          (share)="shareServer($event)"
          (pageChange)="onServerPageChange($event)"
          (searchChange)="onServerSearch($event)"
        />
      }
    </lg-tab-panel>

    <!-- From File -->
    <lg-tab-panel value="file">
      <div class="flex flex-col gap-4 py-4">
        <lg-file-upload
          accept=".lgix,.json,application/json"
          [fileLimit]="1"
          [chooseLabel]="t('openProjectDialog.chooseFile')"
          chooseIcon="ph ph-cloud-arrow-up"
          (onSelect)="onFileSelect($event)"
        >
          {{ t('openProjectDialog.uploadPrompt') }}
        </lg-file-upload>
        @if (importError()) {
          <div
            class="flex items-center gap-2 self-center rounded-lg bg-error-surface px-4 py-2 text-sm text-error"
          >
            <i class="ph ph-warning text-lg"></i>
            <span>{{ importError() }}</span>
          </div>
        }
      </div>
    </lg-tab-panel>
  </lg-tabs>
</div>
