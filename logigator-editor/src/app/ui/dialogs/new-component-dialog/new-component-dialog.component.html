<form *appTranslate="let t" class="flex flex-col gap-4" (ngSubmit)="create()">
  <div class="flex flex-col gap-1">
    <label for="new-component-name">{{ t('newComponentDialog.name') }}</label>
    <input
      lgInputText
      id="new-component-name"
      type="text"
      maxlength="20"
      [ngModel]="name()"
      (ngModelChange)="name.set($event)"
      [ngModelOptions]="{ standalone: true }"
    />
  </div>
  <div class="flex flex-col gap-1">
    <label for="new-component-symbol">{{
      t('newComponentDialog.symbol')
    }}</label>
    <input
      lgInputText
      id="new-component-symbol"
      type="text"
      maxlength="5"
      [ngModel]="symbol()"
      (ngModelChange)="symbol.set($event)"
      [ngModelOptions]="{ standalone: true }"
    />
  </div>
  <div class="flex flex-col gap-1">
    <label
      id="new-component-description-label"
      for="new-component-description"
      >{{ t('newComponentDialog.description') }}</label
    >
    <lg-markdown-field
      [value]="description()"
      [maxLength]="descriptionMaxLength"
      labelledBy="new-component-description-label"
    >
      <textarea
        lgTextarea
        id="new-component-description"
        rows="7"
        class="w-full"
        [attr.maxlength]="descriptionMaxLength"
        [ngModel]="description()"
        (ngModelChange)="description.set($event)"
        [ngModelOptions]="{ standalone: true }"
      ></textarea>
    </lg-markdown-field>
  </div>
  <div class="flex flex-col gap-1">
    <span id="new-component-store-label">{{
      t('newComponentDialog.store')
    }}</span>
    <lg-select-button
      ariaLabelledby="new-component-store-label"
      [options]="sourceOptions"
      optionLabel="label"
      optionValue="value"
      [allowEmpty]="false"
      [ngModel]="source()"
      (ngModelChange)="source.set($event)"
      [ngModelOptions]="{ standalone: true }"
    />
  </div>
  @if (source() === 'server') {
    @if (!userService.user()) {
      <lg-message severity="warn">
        {{ t('newComponentDialog.notLoggedIn') }}
      </lg-message>
    } @else {
      <div class="flex flex-col gap-2">
        <span
          id="new-component-visibility-label"
          class="text-sm font-medium text-text-hover"
          >{{ t('newComponentDialog.visibilityLabel') }}</span
        >
        <app-visibility-picker
          labelledby="new-component-visibility-label"
          [(visibility)]="visibility"
        />
      </div>
    }
  } @else {
    <lg-message severity="info">
      {{ t('newComponentDialog.localWarning') }}
    </lg-message>
  }
  <div class="flex justify-end">
    <button lgButton type="submit" [disabled]="!canCreate">
      {{ t('newComponentDialog.create') }}
    </button>
  </div>
</form>
