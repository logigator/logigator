<div *appTranslate="let t" class="flex flex-col gap-4">
  <p class="m-0">{{ t('shareDialog.intro', { name: name }) }}</p>

  <div class="flex flex-col gap-2">
    <span class="text-sm text-muted">{{ t('shareDialog.linkLabel') }}</span>
    <div class="flex gap-2 items-center">
      <lg-icon-field iconPosition="left" class="flex-1">
        <lg-input-icon class="ph ph-link"></lg-input-icon>
        <input lgInputText readonly class="w-full" [value]="shareUrl()" />
      </lg-icon-field>
      @if (hasSheet) {
        <button lgButton icon="ph ph-share-network" (onClick)="share()">
          {{ t('shareDialog.share') }}
        </button>
      } @else {
        <button lgButton icon="ph ph-copy" (onClick)="copyLink()">
          {{ t('shareDialog.copy') }}
        </button>
      }
    </div>
  </div>

  <div class="flex flex-col gap-2">
    <div>
      <button
        lgButton
        severity="secondary"
        [outlined]="true"
        icon="ph ph-code"
        (onClick)="embedding.set(!embedding())"
      >
        {{ embedding() ? t('shareDialog.embedHide') : t('shareDialog.embed') }}
      </button>
    </div>

    @if (embedding()) {
      <div class="flex flex-col gap-2 rounded-md border border-border p-3">
        <div class="flex flex-wrap gap-2 items-center justify-between">
          <lg-select-button
            [ariaLabel]="t('shareDialog.formatLabel')"
            optionLabel="label"
            optionValue="value"
            [allowEmpty]="false"
            [options]="formatChoices()"
            [ngModel]="format()"
            [ngModelOptions]="{ standalone: true }"
            (ngModelChange)="format.set($event)"
          />
          <button
            lgButton
            severity="secondary"
            [outlined]="true"
            size="sm"
            icon="ph ph-copy"
            (onClick)="copyEmbed()"
          >
            {{ t('shareDialog.embedCopy') }}
          </button>
        </div>
        <!-- Read-only rather than behind the button alone: clipboard access is
             refused in more situations than it is granted, so the snippet has
             to be selectable by hand. -->
        <textarea
          lgTextarea
          readonly
          rows="4"
          class="w-full font-mono text-xs"
          [attr.aria-label]="t('shareDialog.embed')"
          [value]="embed()"
        ></textarea>
        <p class="m-0 text-sm">{{ t('shareDialog.embedHint') }}</p>
      </div>
    }
  </div>

  <div class="flex flex-col gap-2">
    <div>
      <button
        lgButton
        severity="secondary"
        [outlined]="true"
        icon="ph ph-arrows-clockwise"
        [loading]="regenerating()"
        [disabled]="regenerating()"
        (onClick)="regenerateLink()"
      >
        {{ t('shareDialog.regenerate') }}
      </button>
    </div>
    <lg-message severity="warn">
      {{ t('shareDialog.regenerateWarning') }}
    </lg-message>
  </div>

  <div class="flex gap-2 items-center">
    <lg-toggle-switch
      inputId="share-public"
      [ngModel]="isPublic()"
      (ngModelChange)="setPublic($event)"
      [ngModelOptions]="{ standalone: true }"
    />
    <label for="share-public">{{ t('shareDialog.public') }}</label>
    <i
      class="ph ph-info cursor-help text-muted"
      [lgTooltip]="
        t(
          kind === 'component'
            ? 'shareDialog.publicInfoComponent'
            : 'shareDialog.publicInfoProject'
        )
      "
    ></i>
  </div>

  <div class="flex justify-end">
    <button lgButton severity="secondary" [outlined]="true" (onClick)="close()">
      {{ t('shareDialog.close') }}
    </button>
  </div>
</div>
