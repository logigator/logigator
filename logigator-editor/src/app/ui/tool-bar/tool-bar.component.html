<div *transloco="let t" class="flex flex-wrap gap-2 p-2">
  @if (isSimulationMode()) {
    <app-simulation-controls></app-simulation-controls>
    <div class="ml-auto flex flex-wrap gap-1">
      <lg-button
        [lgTooltip]="t('toolBar.exitSim')"
        [tooltipShortcut]="shortcutBinding(actions.TOGGLE_SIMULATION)"
        [ariaLabel]="t('toolBar.exitSim')"
        [label]="t('toolBar.exitSim')"
        (onClick)="exitSimulation()"
        tooltipPosition="bottom"
        icon="ph ph-sign-out"
        severity="secondary"
      ></lg-button>
    </div>
  } @else {
    <div class="flex flex-wrap gap-1">
      <lg-button
        [lgTooltip]="t('toolBar.save')"
        [tooltipShortcut]="shortcutBinding(actions.SAVE)"
        [ariaLabel]="t('toolBar.save')"
        (onClick)="save()"
        tooltipPosition="bottom"
        icon="ph ph-floppy-disk"
        severity="secondary"
      ></lg-button>
      <lg-button
        [lgTooltip]="t('toolBar.open')"
        [tooltipShortcut]="shortcutBinding(actions.OPEN)"
        [ariaLabel]="t('toolBar.open')"
        (onClick)="open()"
        tooltipPosition="bottom"
        icon="ph ph-folder-open"
        severity="secondary"
      ></lg-button>
      <lg-button
        [lgTooltip]="t('toolBar.newComp')"
        [tooltipShortcut]="shortcutBinding(actions.NEW_COMPONENT)"
        [ariaLabel]="t('toolBar.newComp')"
        (onClick)="newComponent()"
        tooltipPosition="bottom"
        icon="ph ph-cpu"
        severity="secondary"
      ></lg-button>
    </div>
    <lg-divider layout="vertical" class="mx-1"></lg-divider>
    <div class="flex flex-wrap gap-1">
      <lg-button
        [lgTooltip]="t('toolBar.copy')"
        [tooltipShortcut]="shortcutBinding(actions.COPY)"
        [ariaLabel]="t('toolBar.copy')"
        [disabled]="!commandState.hasSelection()"
        (onClick)="copy()"
        tooltipPosition="bottom"
        icon="ph ph-copy"
        severity="secondary"
      ></lg-button>
      <lg-button
        [lgTooltip]="t('toolBar.cut')"
        [tooltipShortcut]="shortcutBinding(actions.CUT)"
        [ariaLabel]="t('toolBar.cut')"
        [disabled]="!commandState.hasSelection()"
        (onClick)="cut()"
        tooltipPosition="bottom"
        icon="ph ph-scissors"
        severity="secondary"
      ></lg-button>
      <lg-button
        [lgTooltip]="t('toolBar.paste')"
        [tooltipShortcut]="shortcutBinding(actions.PASTE)"
        [ariaLabel]="t('toolBar.paste')"
        [disabled]="!commandState.canPaste()"
        (onClick)="paste()"
        tooltipPosition="bottom"
        icon="ph ph-clipboard"
        severity="secondary"
      ></lg-button>
      <lg-button
        [lgTooltip]="t('toolBar.delete')"
        [tooltipShortcut]="shortcutBinding(actions.DELETE)"
        [ariaLabel]="t('toolBar.delete')"
        [disabled]="!commandState.hasSelection()"
        (onClick)="delete()"
        tooltipPosition="bottom"
        icon="ph ph-trash"
        severity="secondary"
      ></lg-button>
      <lg-button
        [lgTooltip]="t('toolBar.rotateCw')"
        [tooltipShortcut]="shortcutBinding(actions.ROTATE_SELECTION)"
        [ariaLabel]="t('toolBar.rotateCw')"
        [disabled]="!commandState.hasSelection()"
        (onClick)="rotate(1)"
        tooltipPosition="bottom"
        icon="ph ph-arrow-clockwise"
        severity="secondary"
      ></lg-button>
      <lg-button
        [lgTooltip]="t('toolBar.rotateCcw')"
        [tooltipShortcut]="shortcutBinding(actions.ROTATE_SELECTION_CCW)"
        [ariaLabel]="t('toolBar.rotateCcw')"
        [disabled]="!commandState.hasSelection()"
        (onClick)="rotate(3)"
        tooltipPosition="bottom"
        icon="ph ph-arrow-counter-clockwise"
        severity="secondary"
      ></lg-button>
    </div>
    <lg-divider layout="vertical" class="mx-1"></lg-divider>
    <div class="flex flex-wrap gap-1">
      <lg-button
        [lgTooltip]="t('toolBar.undo')"
        [tooltipShortcut]="shortcutBinding(actions.UNDO)"
        [ariaLabel]="t('toolBar.undo')"
        [disabled]="!commandState.canUndo()"
        (onClick)="undo()"
        tooltipPosition="bottom"
        icon="ph ph-arrow-u-up-left"
        severity="secondary"
      ></lg-button>
      <lg-button
        [lgTooltip]="t('toolBar.redo')"
        [tooltipShortcut]="shortcutBinding(actions.REDO)"
        [ariaLabel]="t('toolBar.redo')"
        [disabled]="!commandState.canRedo()"
        (onClick)="redo()"
        tooltipPosition="bottom"
        icon="ph ph-arrow-u-up-right"
        severity="secondary"
      ></lg-button>
    </div>
    <lg-divider layout="vertical" class="mx-1"></lg-divider>
    <div class="flex flex-wrap gap-1">
      <lg-button
        [lgTooltip]="t('toolBar.zoomOut')"
        [tooltipShortcut]="shortcutBinding(actions.ZOOM_OUT)"
        [ariaLabel]="t('toolBar.zoomOut')"
        [disabled]="!commandState.canZoomOut()"
        (onClick)="zoomOut()"
        tooltipPosition="bottom"
        icon="ph ph-magnifying-glass-minus"
        severity="secondary"
      ></lg-button>
      <lg-button
        [lgTooltip]="t('toolBar.zoomIn')"
        [tooltipShortcut]="shortcutBinding(actions.ZOOM_IN)"
        [ariaLabel]="t('toolBar.zoomIn')"
        [disabled]="!commandState.canZoomIn()"
        (onClick)="zoomIn()"
        tooltipPosition="bottom"
        icon="ph ph-magnifying-glass-plus"
        severity="secondary"
      ></lg-button>
    </div>
    <lg-divider layout="vertical" class="mx-1"></lg-divider>
    <div class="flex flex-wrap gap-1">
      @for (tool of tools; track tool.id) {
        <lg-button
          [lgTooltip]="t(tool.labelKey)"
          [tooltipShortcut]="shortcutBinding(tool.shortcut)"
          [ariaLabel]="t(tool.labelKey)"
          [outlined]="!tool.isActive()"
          (onClick)="tool.activate()"
          tooltipPosition="bottom"
          [icon]="tool.icon"
          severity="secondary"
        ></lg-button>
      }
    </div>
    <div class="ml-auto flex flex-wrap gap-1">
      <lg-button
        [lgTooltip]="t('toolBar.startSim')"
        [tooltipShortcut]="shortcutBinding(actions.TOGGLE_SIMULATION)"
        [ariaLabel]="t('toolBar.startSim')"
        [label]="t('toolBar.startSim')"
        (onClick)="startSimulation()"
        tooltipPosition="bottom"
        icon="ph ph-play"
        severity="secondary"
      ></lg-button>
    </div>
  }
</div>
