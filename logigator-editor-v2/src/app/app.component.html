<p-confirmpopup key="inline" />
<p-confirm-dialog />

@if (layout.isCompact()) {
  <app-mobile-top-bar></app-mobile-top-bar>
} @else {
  <app-title-bar></app-title-bar>
  <app-tool-bar class="border-b border-border"></app-tool-bar>
}

<div class="flex grow min-h-0">
  @if (!layout.isCompact() && !isSimulation()) {
    <app-side-bar class="w-77 border-r border-border overflow-y-auto"></app-side-bar>
  }
  <div class="grow flex flex-col min-w-0">
    <app-tab-bar></app-tab-bar>
    <div class="relative grow">
      <!-- One canvas for every device; only the chrome around it swaps. -->
      <app-board
        class="block w-full h-full"
        [project]="projectService.activeProject()"
        (cursorPositionChange)="cursorPosition.set($event)"
      ></app-board>
      <p-toast position="bottom-left" class="absolute! -mb-4" />

      @if (!layout.isCompact()) {
        <app-component-settings></app-component-settings>
      } @else {
        <!-- Overlays: the container lets pointer events fall through to the
             canvas; each control re-enables them for itself. -->
        <div class="pointer-events-none absolute inset-0">
          <app-mobile-status
            class="pointer-events-auto absolute left-2 top-2"
            [cursorPosition]="cursorPosition()"
          ></app-mobile-status>
          <app-zoom-fab
            class="pointer-events-auto absolute bottom-24 right-3"
          ></app-zoom-fab>
          @if (!isSimulation()) {
            <app-selection-action-bar
              class="pointer-events-auto absolute bottom-20 left-1/2 -translate-x-1/2"
            ></app-selection-action-bar>
            <app-tool-hud
              class="pointer-events-auto absolute bottom-3 left-1/2 -translate-x-1/2"
              style="padding-bottom: env(safe-area-inset-bottom)"
            ></app-tool-hud>
          }
        </div>
      }
    </div>

    @if (layout.isCompact()) {
      @if (isSimulation()) {
        <app-simulation-controls
          class="flex gap-2 overflow-x-auto border-t border-border p-2"
          style="padding-bottom: env(safe-area-inset-bottom)"
        ></app-simulation-controls>
      }
    } @else {
      <app-status-bar [cursorPosition]="cursorPosition()"></app-status-bar>
    }
  </div>
</div>

@if (layout.isCompact()) {
  <ng-container *transloco="let t">
    <p-drawer
      [visible]="mobileUi.activeSheet() === 'palette'"
      (visibleChange)="onSheetClosed($event)"
      position="bottom"
      styleClass="h-[70vh]!"
      [header]="t('mobile.palette')"
    >
      <app-component-list></app-component-list>
    </p-drawer>

    <p-drawer
      [visible]="mobileUi.activeSheet() === 'settings'"
      (visibleChange)="onSheetClosed($event)"
      position="bottom"
      [header]="t('mobile.settings')"
    >
      <app-component-settings [floating]="false"></app-component-settings>
    </p-drawer>

    @if (isEditingComponent()) {
      <p-drawer
        [visible]="mobileUi.activeSheet() === 'ports'"
        (visibleChange)="onSheetClosed($event)"
        position="right"
        [header]="t('mobile.ports')"
      >
        <app-ports-panel></app-ports-panel>
      </p-drawer>
    }

    <p-drawer
      [visible]="mobileUi.activeSheet() === 'menu'"
      (visibleChange)="onSheetClosed($event)"
      position="left"
      [header]="t('mobile.menu')"
    >
      <p-panelmenu [model]="menuItems()" styleClass="border-0"></p-panelmenu>
    </p-drawer>
  </ng-container>
}
