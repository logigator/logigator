<div class="flex flex-col items-center gap-2 px-4 pt-4">
  @if (userService.user(); as user) {
    <lg-avatar
      [image]="userImageUrl()"
      [label]="userImageUrl() ? undefined : userInitial()"
      shape="circle"
      size="xlarge"
    />
    <span class="font-semibold text-lg">{{ user.username }}</span>
  } @else {
    <lg-avatar icon="ph ph-user" shape="circle" size="xlarge" />
    <span class="text-sm">Not signed in</span>
  }
</div>
<lg-divider class="my-4" />
<div class="flex flex-col gap-4 px-4 pb-4">
  <div class="flex flex-col gap-2">
    <span class="text-xs font-semibold uppercase tracking-wider text-muted"
      >Theme</span
    >
    <app-theme-switcher class="min-w-64" />
  </div>
  <div class="flex flex-col gap-2">
    <span class="text-xs font-semibold uppercase tracking-wider text-muted"
      >Language</span
    >
    <app-language-switcher />
  </div>
  <div class="flex flex-col gap-2">
    <span class="text-xs font-semibold uppercase tracking-wider text-muted"
      >Editor Settings</span
    >
    <app-settings />
  </div>
</div>
<lg-divider class="mb-1" />
@if (userService.user()) {
  <button
    type="button"
    lgRipple
    class="flex w-full cursor-pointer items-center gap-2 rounded px-3 py-2 text-left text-text hover:bg-content-hover"
    (click)="openAccountSettings()"
  >
    <i class="ph ph-user" aria-hidden="true"></i>
    <span>Account</span>
  </button>
  <button
    type="button"
    lgRipple
    class="flex w-full cursor-pointer items-center gap-2 rounded px-3 py-2 text-left text-text hover:bg-content-hover"
    (click)="logout()"
  >
    <i class="ph ph-sign-out" aria-hidden="true"></i>
    <span>Log Out</span>
  </button>
} @else {
  <button
    type="button"
    lgRipple
    class="flex w-full cursor-pointer items-center gap-2 rounded px-3 py-2 text-left text-text hover:bg-content-hover"
    (click)="login()"
  >
    <i class="ph ph-sign-in" aria-hidden="true"></i>
    <span>Log In</span>
  </button>
}
