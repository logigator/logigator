<canvas
  #canvas
  class="absolute touch-none transition-opacity duration-150 ease-out"
  [class.opacity-0]="!loaded()"
></canvas>
@if (editorSettings.fpsCounter.value() && loaded()) {
  <app-fps-counter [ticker]="ticker" />
}
@if (editorSettings.showMinimap.value() && loaded()) {
  <app-minimap [project]="project()" />
}
