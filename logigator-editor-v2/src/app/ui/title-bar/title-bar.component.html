<lg-menubar [model]="items()" class="bg-primary-400 text-surface-900">
  <ng-template #start>
    <a class="relative w-40 h-8" href="/" target="_blank">
      <img [ngSrc]="logoUrl" alt="Logo" fill priority />
    </a>
    <h1 class="text-xl font-bold mx-4">{{ projectName() }}</h1>
  </ng-template>
  <ng-template #end>
    <app-user-settings />
  </ng-template>
</lg-menubar>
