<div *transloco="let t" class="flex flex-col gap-4">
  <p>{{ t('logoutDialog.message') }}</p>

  <ul class="list-disc pl-5">
    @for (name of names; track name) {
      <li>{{ name }}</li>
    }
  </ul>

  @if (promotionWarning) {
    <lg-message severity="warn">{{ promotionWarning }}</lg-message>
  }

  <div class="flex justify-end gap-2">
    <lg-button
      severity="danger"
      [outlined]="true"
      [label]="t('logoutDialog.discard')"
      (onClick)="discard()"
    />
    <lg-button
      severity="secondary"
      [outlined]="true"
      [label]="t('logoutDialog.cancel')"
      (onClick)="cancel()"
    />
    <lg-button [label]="t('logoutDialog.save')" (onClick)="save()" />
  </div>
</div>
