<div *transloco="let t" class="flex flex-col items-center gap-1">
  @if (activeLabelKey(); as labelKey) {
    <span
      class="rounded bg-content/90 px-2 py-0.5 text-xs text-muted shadow backdrop-blur"
    >
      {{ t(labelKey) }}
    </span>
  }
  <div
    class="flex items-center gap-1 rounded-full bg-content/95 px-1.5 py-1 shadow-lg backdrop-blur"
  >
    @for (tool of primaryTools; track tool.id) {
      <lg-button
        [icon]="tool.icon"
        severity="secondary"
        rounded
        [text]="!tool.isActive()"
        [ariaLabel]="t(tool.labelKey)"
        (onClick)="tool.activate()"
      ></lg-button>
    }
    <lg-button
      icon="ph ph-plus"
      severity="secondary"
      rounded
      [text]="!partsActive()"
      [ariaLabel]="t('toolBar.parts')"
      (onClick)="toggleParts()"
    ></lg-button>
    <lg-button
      icon="ph ph-dots-three"
      severity="secondary"
      rounded
      [text]="!moreActive()"
      [ariaLabel]="t('toolBar.more')"
      (onClick)="morePop.toggle($event)"
    ></lg-button>
  </div>
  <lg-popover #morePop>
    <div class="flex items-center gap-1">
      @for (tool of moreTools; track tool.id) {
        <lg-button
          [icon]="tool.icon"
          severity="secondary"
          [text]="!tool.isActive()"
          [ariaLabel]="t(tool.labelKey)"
          (onClick)="tool.activate(); morePop.hide()"
        ></lg-button>
      }
      @if (isEditingComponent()) {
        <lg-button
          icon="ph ph-plugs"
          severity="secondary"
          text
          [ariaLabel]="t('mobile.ports')"
          (onClick)="openPorts(); morePop.hide()"
        ></lg-button>
      }
    </div>
  </lg-popover>
</div>
