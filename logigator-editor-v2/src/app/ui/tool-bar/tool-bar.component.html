<div *transloco="let t" class="flex flex-wrap gap-2 p-2">
  @if (isSimulationMode()) {
    <div class="flex flex-wrap gap-1">
      <p-button
        [pTooltip]="t('toolBar.exitSim')"
        [ariaLabel]="t('toolBar.exitSim')"
        (onClick)="exitSimulation()"
        tooltipPosition="bottom"
        icon="ph ph-sign-out"
        severity="secondary"
      ></p-button>
    </div>
    <p-divider layout="vertical" class="mx-1!"></p-divider>
    <!-- Run controls come alive once the worker session reports ready. -->
    <div class="flex flex-wrap gap-1">
      <p-button
        [pTooltip]="t('toolBar.play')"
        [ariaLabel]="t('toolBar.play')"
        [disabled]="!isSimReady() || isSimRunning()"
        (onClick)="playSimulation()"
        tooltipPosition="bottom"
        icon="ph ph-play"
        severity="secondary"
      ></p-button>
      <p-button
        [pTooltip]="t('toolBar.pause')"
        [ariaLabel]="t('toolBar.pause')"
        [disabled]="!isSimRunning()"
        (onClick)="pauseSimulation()"
        tooltipPosition="bottom"
        icon="ph ph-pause"
        severity="secondary"
      ></p-button>
      <p-button
        [pTooltip]="t('toolBar.step')"
        [ariaLabel]="t('toolBar.step')"
        [disabled]="!isSimReady() || isSimRunning()"
        (onClick)="stepSimulation()"
        tooltipPosition="bottom"
        icon="ph ph-skip-forward"
        severity="secondary"
      ></p-button>
      <p-button
        [pTooltip]="t('toolBar.stopSim')"
        [ariaLabel]="t('toolBar.stopSim')"
        [disabled]="!isSimReady()"
        (onClick)="stopSimulation()"
        tooltipPosition="bottom"
        icon="ph ph-stop"
        severity="secondary"
      ></p-button>
    </div>
    <p-divider layout="vertical" class="mx-1!"></p-divider>
    <div class="flex flex-wrap items-center gap-2">
      <p-button
        [pTooltip]="t('toolBar.targetMode')"
        [ariaLabel]="t('toolBar.targetMode')"
        [disabled]="!isSimReady()"
        [outlined]="simMode() !== 'target'"
        (onClick)="toggleTargetMode()"
        tooltipPosition="bottom"
        icon="ph ph-gauge"
        severity="secondary"
      ></p-button>
      <input
        pInputText
        type="number"
        min="1"
        step="any"
        class="w-24"
        [disabled]="!isSimReady()"
        [pTooltip]="t('toolBar.targetSpeed')"
        [ariaLabel]="t('toolBar.targetSpeed')"
        tooltipPosition="bottom"
        [value]="targetValue()"
        (input)="onTargetValueInput($event)"
      />
      <p-select
        [options]="targetUnitOptions"
        [ngModel]="targetUnit()"
        (ngModelChange)="onTargetUnitChange($event)"
        [disabled]="!isSimReady()"
        optionLabel="label"
        optionValue="value"
        [pTooltip]="t('toolBar.targetUnit')"
        [ariaLabel]="t('toolBar.targetUnit')"
        tooltipPosition="bottom"
      ></p-select>
      <p-button
        [pTooltip]="t('toolBar.syncToFrame')"
        [ariaLabel]="t('toolBar.syncToFrame')"
        [disabled]="!isSimReady()"
        [outlined]="simMode() !== 'sync'"
        (onClick)="toggleSyncMode()"
        tooltipPosition="bottom"
        icon="ph ph-monitor-play"
        severity="secondary"
      ></p-button>
      <span class="text-sm opacity-70 select-none">
        {{ t('toolBar.measuredHz', { hz: measuredHz() | si: 0 }) }}
        &middot;
        {{ t('toolBar.ticks', { ticks: simTick() }) }}
      </span>
    </div>
  } @else {
    <div class="flex flex-wrap gap-1">
      <p-button
        [pTooltip]="saveTooltip()"
        [ariaLabel]="saveTooltip()"
        (onClick)="save()"
        tooltipPosition="bottom"
        icon="ph ph-floppy-disk"
        severity="secondary"
      ></p-button>
      <p-button
        [pTooltip]="openTooltip()"
        [ariaLabel]="openTooltip()"
        (onClick)="open()"
        tooltipPosition="bottom"
        icon="ph ph-folder-open"
        severity="secondary"
      ></p-button>
      <p-button
        [pTooltip]="t('toolBar.newComp')"
        [ariaLabel]="t('toolBar.newComp')"
        tooltipPosition="bottom"
        icon="ph ph-cpu"
        severity="secondary"
      ></p-button>
    </div>
    <p-divider layout="vertical" class="mx-1!"></p-divider>
    <div class="flex flex-wrap gap-1">
      <p-button
        [pTooltip]="copyTooltip()"
        [ariaLabel]="copyTooltip()"
        (onClick)="copy()"
        tooltipPosition="bottom"
        icon="ph ph-copy"
        severity="secondary"
      ></p-button>
      <p-button
        [pTooltip]="cutTooltip()"
        [ariaLabel]="cutTooltip()"
        (onClick)="cut()"
        tooltipPosition="bottom"
        icon="ph ph-scissors"
        severity="secondary"
      ></p-button>
      <p-button
        [pTooltip]="pasteTooltip()"
        [ariaLabel]="pasteTooltip()"
        (onClick)="paste()"
        tooltipPosition="bottom"
        icon="ph ph-clipboard"
        severity="secondary"
      ></p-button>
      <p-button
        [pTooltip]="deleteTooltip()"
        [ariaLabel]="deleteTooltip()"
        (onClick)="delete()"
        tooltipPosition="bottom"
        icon="ph ph-trash"
        severity="secondary"
      ></p-button>
    </div>
    <p-divider layout="vertical" class="mx-1!"></p-divider>
    <div class="flex flex-wrap gap-1">
      <p-button
        [pTooltip]="undoTooltip()"
        [ariaLabel]="undoTooltip()"
        (onClick)="undo()"
        tooltipPosition="bottom"
        icon="ph ph-arrow-u-up-left"
        severity="secondary"
      ></p-button>
      <p-button
        [pTooltip]="redoTooltip()"
        [ariaLabel]="redoTooltip()"
        (onClick)="redo()"
        tooltipPosition="bottom"
        icon="ph ph-arrow-u-up-right"
        severity="secondary"
      ></p-button>
    </div>
    <p-divider layout="vertical" class="mx-1!"></p-divider>
    <div class="flex flex-wrap gap-1">
      <p-button
        [pTooltip]="zoomOutTooltip()"
        [ariaLabel]="zoomOutTooltip()"
        (onClick)="zoomOut()"
        tooltipPosition="bottom"
        icon="ph ph-magnifying-glass-minus"
        severity="secondary"
      ></p-button>
      <p-button
        [pTooltip]="zoomInTooltip()"
        [ariaLabel]="zoomInTooltip()"
        (onClick)="zoomIn()"
        tooltipPosition="bottom"
        icon="ph ph-magnifying-glass-plus"
        severity="secondary"
      ></p-button>
    </div>
    <p-divider layout="vertical" class="mx-1!"></p-divider>
    <div class="flex flex-wrap gap-1">
      <p-button
        [pTooltip]="placeWiresTooltip()"
        [ariaLabel]="placeWiresTooltip()"
        [outlined]="!isWireDrawMode()"
        (onClick)="setWireDrawMode()"
        tooltipPosition="bottom"
        icon="ph ph-line-segment"
        severity="secondary"
      ></p-button>
      <p-button
        [pTooltip]="connWiresTooltip()"
        [ariaLabel]="connWiresTooltip()"
        [outlined]="!isWireConnMode()"
        (onClick)="setWireConnMode()"
        tooltipPosition="bottom"
        icon="ph ph-prohibit"
        severity="secondary"
      ></p-button>
      <p-button
        [pTooltip]="selectTooltip()"
        [ariaLabel]="selectTooltip()"
        [outlined]="!isSelectMode()"
        (onClick)="setSelectMode()"
        tooltipPosition="bottom"
        icon="ph ph-selection"
        severity="secondary"
      ></p-button>
      <p-button
        [pTooltip]="selExactTooltip()"
        [ariaLabel]="selExactTooltip()"
        [outlined]="!isSelectExactMode()"
        (onClick)="setSelectExactMode()"
        tooltipPosition="bottom"
        icon="ph ph-selection-slash"
        severity="secondary"
      ></p-button>
      <p-button
        [pTooltip]="eraserTooltip()"
        [ariaLabel]="eraserTooltip()"
        [outlined]="!isEraseMode()"
        (onClick)="setEraseMode()"
        tooltipPosition="bottom"
        icon="ph ph-eraser"
        severity="secondary"
      ></p-button>
      <p-button
        [pTooltip]="textTooltip()"
        [ariaLabel]="textTooltip()"
        [outlined]="!isPlaceTextMode()"
        (onClick)="setPlaceTextMode()"
        tooltipPosition="bottom"
        icon="ph ph-text-t"
        severity="secondary"
      ></p-button>
      <p-button
        [pTooltip]="negateTooltip()"
        [ariaLabel]="negateTooltip()"
        [outlined]="!isPortNegationMode()"
        (onClick)="setPortNegationMode()"
        tooltipPosition="bottom"
        icon="ph ph-circle-half-tilt"
        severity="secondary"
      ></p-button>
    </div>
    <p-divider layout="vertical" class="mx-1!"></p-divider>
    <div class="flex flex-wrap gap-1">
      <p-button
        [pTooltip]="t('toolBar.startSim')"
        [ariaLabel]="t('toolBar.startSim')"
        (onClick)="startSimulation()"
        tooltipPosition="bottom"
        icon="ph ph-play"
        severity="secondary"
      ></p-button>
    </div>
  }
</div>
