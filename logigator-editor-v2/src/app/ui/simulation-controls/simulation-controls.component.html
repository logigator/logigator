<div
  *transloco="let t"
  [class]="
    wrap()
      ? 'flex flex-wrap items-center gap-2'
      : 'flex items-center gap-2 w-max'
  "
>
  <!-- Run controls come alive once the worker session reports ready. -->
  <div class="flex flex-wrap gap-1">
    <lg-button
      [lgTooltip]="t('toolBar.play')"
      [ariaLabel]="t('toolBar.play')"
      [disabled]="!isSimReady() || isSimRunning()"
      (onClick)="playSimulation()"
      tooltipPosition="bottom"
      icon="ph ph-play"
      severity="secondary"
    ></lg-button>
    <lg-button
      [lgTooltip]="t('toolBar.pause')"
      [ariaLabel]="t('toolBar.pause')"
      [disabled]="!isSimRunning()"
      (onClick)="pauseSimulation()"
      tooltipPosition="bottom"
      icon="ph ph-pause"
      severity="secondary"
    ></lg-button>
    <lg-button
      [lgTooltip]="t('toolBar.step')"
      [ariaLabel]="t('toolBar.step')"
      [disabled]="!isSimReady() || isSimRunning()"
      (onClick)="stepSimulation()"
      tooltipPosition="bottom"
      icon="ph ph-skip-forward"
      severity="secondary"
    ></lg-button>
    <lg-button
      [lgTooltip]="t('toolBar.stopSim')"
      [ariaLabel]="t('toolBar.stopSim')"
      [disabled]="!isSimReady()"
      (onClick)="stopSimulation()"
      tooltipPosition="bottom"
      icon="ph ph-stop"
      severity="secondary"
    ></lg-button>
  </div>
  <lg-divider layout="vertical" class="mx-1!"></lg-divider>
  <div class="flex flex-wrap items-center gap-2">
    <lg-button
      [lgTooltip]="t('toolBar.targetMode')"
      [ariaLabel]="t('toolBar.targetMode')"
      [disabled]="!isSimReady()"
      [outlined]="simMode() !== 'target'"
      (onClick)="toggleTargetMode()"
      tooltipPosition="bottom"
      icon="ph ph-gauge"
      severity="secondary"
    ></lg-button>
    <input
      lgInputText
      type="number"
      min="1"
      step="any"
      class="w-24"
      [disabled]="!isSimReady()"
      [lgTooltip]="t('toolBar.targetSpeed')"
      [ariaLabel]="t('toolBar.targetSpeed')"
      tooltipPosition="bottom"
      [value]="targetValue()"
      (input)="onTargetValueInput($event)"
    />
    <p-select
      [options]="targetUnitOptions"
      [ngModel]="targetUnit()"
      (ngModelChange)="onTargetUnitChange($event)"
      [disabled]="!isSimReady()"
      optionLabel="label"
      optionValue="value"
      [lgTooltip]="t('toolBar.targetUnit')"
      [ariaLabel]="t('toolBar.targetUnit')"
      tooltipPosition="bottom"
    ></p-select>
    <lg-button
      [lgTooltip]="t('toolBar.syncToFrame')"
      [ariaLabel]="t('toolBar.syncToFrame')"
      [disabled]="!isSimReady()"
      [outlined]="simMode() !== 'sync'"
      (onClick)="toggleSyncMode()"
      tooltipPosition="bottom"
      icon="ph ph-monitor-play"
      severity="secondary"
    ></lg-button>
    <span class="text-sm opacity-70 select-none">
      {{ t('toolBar.measuredHz', { hz: measuredHz() | si: 0 }) }}
      &middot;
      {{ t('toolBar.ticks', { ticks: simTick() }) }}
    </span>
  </div>
</div>
