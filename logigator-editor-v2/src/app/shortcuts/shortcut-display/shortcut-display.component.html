<div class="inline-flex gap-1 items-center">
  @for (part of parts(); track $index) {
    <kbd
      class="font-mono leading-normal inline-block px-1 text-xs rounded border bg-content-hover border-border text-muted"
      >{{ part }}</kbd
    >
    @if (!shortcutService.isMac && !$last) {
      <span class="text-xs text-muted">+</span>
    }
  } @empty {
    <span class="text-xs text-muted">–</span>
  }
</div>
