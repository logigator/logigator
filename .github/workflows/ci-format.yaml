name: 'CI format'

# Prettier runs over the whole repo, so this workflow deliberately has no path
# filter: root files (README, AGENTS.md, the compose files, these workflows) are
# checked by nothing else, and the package workflows keep their narrow filters
# instead of rebuilding an application for a documentation typo.
on:
  pull_request:
  push:
    branches:
      - 'master'

permissions:
  contents: read

jobs:
  ci:
    name: 'CI format'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: 'Setup Node'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.x'
          package-manager-cache: false

      # Prettier is a root devDependency, so the workspace install is what makes
      # it available. It shares the cache with the other workspace workflows.
      - name: Install Dependencies
        uses: ./.github/actions/yarn-install
        with:
          cache-prefix: workspace

      - name: 'Format'
        shell: bash
        run: yarn run format
