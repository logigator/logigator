name: 'CI logigator-editor'
on:
  pull_request:
  push:
    branches:
      - 'master'

permissions:
  contents: read

jobs:
  pre_job:
    runs-on: ubuntu-latest
    # What skip-duplicate-actions needs to read runs and cancel outdated ones.
    permissions:
      actions: write
      contents: read
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          concurrent_skipping: 'never'
          cancel_others: 'true'
          skip_after_successful_duplicate: 'true'
          github_token: ${{ github.token }}
          paths: '["logigator-editor/**", "logigator-ui/**", "logigator-core/**", "logigator-contract/**", "logigator-docs/**", "CHANGELOG.md", "changelog/**", ".yarn/patches/**", "package.json", "yarn.lock", ".yarnrc.yml", "angular.json", "tsconfig.json", "eslint.config.mjs", ".github/workflows/ci-logigator-editor.yaml", ".github/actions/yarn-install/**"]'

  ci:
    name: 'CI logigator-editor'
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: 'Setup Node'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.x'
          package-manager-cache: false

      - name: Install Dependencies
        uses: ./.github/actions/yarn-install
        with:
          cache-prefix: workspace

      - name: 'Lint'
        shell: bash
        run: |
          yarn run lint:editor
          yarn run lint:ui
          yarn run lint:core
          yarn run lint:contract
          yarn run lint:docs

      - name: 'Typecheck'
        shell: bash
        run: |
          yarn run typecheck:core
          yarn run typecheck:contract
          yarn run typecheck:docs

      - name: 'Test'
        shell: bash
        run: |
          yarn run test:editor
          yarn run test:ui
          yarn run test:core
          yarn run test:contract
          yarn run test:docs

      - name: 'Build'
        shell: bash
        run: yarn run build:editor
