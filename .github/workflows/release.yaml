name: 'Release'

# A `v*` tag is the whole release: its notes are checked and taken from the
# changelog, the images are pushed, and only then is the GitHub Release created.
# All of it stays in one workflow because a Release created with GITHUB_TOKEN
# starts no other workflow.
on:
  push:
    tags:
      - 'v*'

jobs:
  release-notes:
    name: Check the version and take the release notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          package-manager-cache: false

      - name: Write the release notes
        run: >-
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON
          .github/scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md

      - name: Keep the release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  # One image per runtime target of the Dockerfile. The builds run in one job,
  # one after another, so each reuses the workspace install the first one built.
  build-and-push-images:
    name: Build and push Docker images
    needs: release-notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Compute build metadata
        id: buildmeta
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (web)
        uses: docker/metadata-action@v5
        id: meta-web
        with:
          images: |
            ghcr.io/${{ github.repository }}-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=logigator-web

      - name: Build and push (web)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          platforms: linux/amd64
          build-args: |
            GIT_COMMIT=${{ steps.buildmeta.outputs.commit }}
            BUILD_DATE=${{ steps.buildmeta.outputs.date }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          annotations: ${{ steps.meta-web.outputs.annotations }}

      - name: Extract metadata (api)
        uses: docker/metadata-action@v5
        id: meta-api
        with:
          images: |
            ghcr.io/${{ github.repository }}-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=logigator-api

      - name: Build and push (api)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          platforms: linux/amd64
          build-args: |
            GIT_COMMIT=${{ steps.buildmeta.outputs.commit }}
            BUILD_DATE=${{ steps.buildmeta.outputs.date }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          annotations: ${{ steps.meta-api.outputs.annotations }}

      - name: Extract metadata (proxy)
        uses: docker/metadata-action@v5
        id: meta-proxy
        with:
          images: |
            ghcr.io/${{ github.repository }}-proxy
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=logigator-proxy

      - name: Build and push (proxy)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: proxy
          push: true
          platforms: linux/amd64
          build-args: |
            GIT_COMMIT=${{ steps.buildmeta.outputs.commit }}
            BUILD_DATE=${{ steps.buildmeta.outputs.date }}
          tags: ${{ steps.meta-proxy.outputs.tags }}
          labels: ${{ steps.meta-proxy.outputs.labels }}
          annotations: ${{ steps.meta-proxy.outputs.annotations }}

  github-release:
    name: Publish the GitHub Release
    needs: build-and-push-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch the release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      # A tag with a suffix (`v2.3.0-beta.1`) is a prerelease. A Release that
      # already exists, drafted by hand for this tag, gets the notes instead.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            prerelease=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              prerelease=(--prerelease --latest=false)
            fi
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file release-notes.md "${prerelease[@]}"
          fi
