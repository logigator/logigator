name: 'Release'

# A `v*` tag is the whole release: its commit's CI is checked, its notes are
# checked and taken from the changelog, the images are pushed, and only then is
# the GitHub Release created.
# All of it stays in one workflow because a Release created with GITHUB_TOKEN
# starts no other workflow.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Every workflow run on the tagged commit, apart from this one, has to finish
  # with success. One still running is waited for, so a tag pushed right behind
  # its commit is not refused for being early; a package workflow that skipped
  # its job for the commit's paths still ends as a success.
  ci-status:
    name: Check that CI passed on the commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
    steps:
      - name: Wait for CI and check its result
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          runs() {
            gh run list --commit "$GITHUB_SHA" --limit 100 \
              --json databaseId,workflowName,status,conclusion \
              --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)]"
          }
          if [[ $(runs | jq length) -eq 0 ]]; then
            echo "::error::No CI ran on $GITHUB_SHA; push it to a branch before tagging it"
            exit 1
          fi
          for id in $(runs | jq -r '.[] | select(.status != "completed") | .databaseId'); do
            gh run watch "$id" --interval 30 > /dev/null
          done
          failed=$(runs | jq -r '.[] | select(.conclusion != "success") | .workflowName')
          if [[ -n $failed ]]; then
            echo "::error::CI did not pass on $GITHUB_SHA: $failed"
            exit 1
          fi

  release-notes:
    name: Check the version and take the release notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.x'
          package-manager-cache: false

      - name: Write the release notes
        run: >-
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON
          .github/scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md

      - name: Keep the release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  # One image per runtime target of the Dockerfile. The builds run in one job,
  # one after another, so each reuses the workspace install the first one built.
  build-and-push-images:
    name: Build and push Docker images
    needs:
      - ci-status
      - release-notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute build metadata
        id: buildmeta
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (web)
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta-web
        with:
          images: |
            ghcr.io/${{ github.repository }}-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=logigator-web

      - name: Build and push (web)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          push: true
          platforms: linux/amd64
          build-args: |
            GIT_COMMIT=${{ steps.buildmeta.outputs.commit }}
            BUILD_DATE=${{ steps.buildmeta.outputs.date }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          annotations: ${{ steps.meta-web.outputs.annotations }}

      - name: Extract metadata (api)
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta-api
        with:
          images: |
            ghcr.io/${{ github.repository }}-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=logigator-api

      - name: Build and push (api)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: api
          push: true
          platforms: linux/amd64
          build-args: |
            GIT_COMMIT=${{ steps.buildmeta.outputs.commit }}
            BUILD_DATE=${{ steps.buildmeta.outputs.date }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          annotations: ${{ steps.meta-api.outputs.annotations }}

      - name: Extract metadata (origin)
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta-origin
        with:
          images: |
            ghcr.io/${{ github.repository }}-origin
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=logigator-origin

      - name: Build and push (origin)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: origin
          push: true
          platforms: linux/amd64
          build-args: |
            GIT_COMMIT=${{ steps.buildmeta.outputs.commit }}
            BUILD_DATE=${{ steps.buildmeta.outputs.date }}
          tags: ${{ steps.meta-origin.outputs.tags }}
          labels: ${{ steps.meta-origin.outputs.labels }}
          annotations: ${{ steps.meta-origin.outputs.annotations }}

  github-release:
    name: Publish the GitHub Release
    needs: build-and-push-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      # A tag with a suffix (`v2.3.0-beta.1`) is a prerelease. A Release that
      # already exists, drafted by hand for this tag, gets the notes instead.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            prerelease=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              prerelease=(--prerelease --latest=false)
            fi
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file release-notes.md "${prerelease[@]}"
          fi
