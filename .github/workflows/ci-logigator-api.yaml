name: 'CI logigator-api'
on:
  pull_request:
  push:
    branches:
      - 'master'
      - 'development'

jobs:
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'never'
          cancel_others: 'true'
          skip_after_successful_duplicate: 'true'
          # The API bundles @logigator/core and @logigator/contract from source,
          # so a change to either has to run this workflow too.
          paths: '["logigator-api/**", "logigator-core/**", "logigator-contract/**", "package.json", "yarn.lock", ".yarnrc.yml", "tsconfig.json", "eslint.config.mjs"]'

  ci:
    name: 'CI logigator-api'
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v5

      - name: 'Setup Node'
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          package-manager-cache: false

      # The API is a member of the root Yarn workspace (unlike the legacy
      # backend, which keeps its own lockfile), so the install runs at the root.
      - name: Install Dependencies
        uses: ./.github/actions/yarn-install
        with:
          cache-prefix: workspace

      # Prettier is not run here: `yarn format` covers the whole repo, so it has
      # its own unfiltered workflow (ci-format).
      - name: 'Lint'
        shell: bash
        run: |
          yarn run lint:api
          yarn run lint:core
          yarn run lint:contract

      - name: 'Typecheck'
        shell: bash
        run: |
          yarn run typecheck:api
          yarn run typecheck:core
          yarn run typecheck:contract

      - name: 'Test'
        shell: bash
        run: |
          yarn run test:api
          yarn run test:core
          yarn run test:contract

      - name: 'Build'
        shell: bash
        run: yarn run build:api
