name: 'CI images'

# Builds the production images, which no package workflow does: the Dockerfile's
# stages, its installs and what each stage copies. Where the stack's own wiring
# changed, it then runs them as the production compose file does, behind the
# local edge, and asks each application for a page through it.
on:
  pull_request:
  push:
    branches:
      - 'master'

permissions:
  contents: read

jobs:
  pre_job:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    outputs:
      skip_build: ${{ steps.build.outputs.should_skip }}
      skip_stack: ${{ steps.stack.outputs.should_skip }}
    steps:
      # Two checks rather than one `paths_filter`, which the action's own
      # documentation advises against relying on.
      - id: build
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          concurrent_skipping: 'never'
          cancel_others: 'true'
          skip_after_successful_duplicate: 'true'
          paths: '["Dockerfile", ".dockerignore", "Caddyfile.production", "docker-compose.production.yaml", "package.json", "logigator-*/package.json", "yarn.lock", ".yarnrc.yml", ".yarn/patches/**", "logigator-editor/packages/router-stub/**", "angular.json", "tsconfig.json", ".github/workflows/ci-images.yaml"]'

      # Starting the stack catches what a build cannot — the forwarding
      # headers, the migration step, the editor's routes — and only these
      # files decide those.
      - id: stack
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          concurrent_skipping: 'never'
          skip_after_successful_duplicate: 'true'
          paths: '["Dockerfile", "Caddyfile.production", "docker-compose.production.yaml", ".github/workflows/ci-images.yaml"]'

  ci:
    name: 'CI images'
    needs: pre_job
    if: ${{ needs.pre_job.outputs.skip_build != 'true' }}
    runs-on: 'ubuntu-latest'
    env:
      COMPOSE_FILE: docker-compose.production.yaml
      COMPOSE_PROFILES: local
      SESSION_SECRET: ci-session-secret-of-at-least-32-characters
    steps:
      - name: 'Checkout'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: 'Build'
        shell: bash
        run: docker compose build

      # The edge depends on a healthy proxy, the proxy on a healthy site and
      # API, the migration on a healthy Redis, so `up` returns only once every
      # healthcheck has passed and fails on one that cannot: a check that does
      # not run in its image fails here rather than on the server.
      - name: 'Start the stack'
        if: ${{ needs.pre_job.outputs.skip_stack != 'true' }}
        shell: bash
        run: docker compose up --detach

      # Every request goes through the edge on 443, as a browser's would. The
      # API is ready once it has migrated, seeded the examples and reached
      # Postgres and Redis, which is the slowest part of the stack to come up.
      - name: 'Smoke test'
        if: ${{ needs.pre_job.outputs.skip_stack != 'true' }}
        shell: bash
        run: |
          site=https://logigator.test
          fetch() {
            curl --silent --show-error --fail --insecure \
              --resolve logigator.test:443:127.0.0.1 "$@"
          }
          expect_page() {
            local body
            body=$(fetch "$1")
            if [[ $body != *"$2"* ]]; then
              echo "::error::$1 does not contain $2"
              exit 1
            fi
          }

          fetch --retry 90 --retry-delay 2 --retry-all-errors \
            --output /dev/null "$site/api/health/ready"

          # Rendered on the server, through the API.
          expect_page "$site/en" 'ng-server-context="ssr"'
          # The origin the site derives from the forwarded host and scheme.
          expect_page "$site/robots.txt" "Sitemap: $site/sitemap.xml"
          # The editor's shell, at its address and at one of its routes.
          expect_page "$site/editor" '<base href="/editor/">'
          expect_page "$site/editor/project/smoke-test" '<base href="/editor/">'

          # The security headers, on every surface. A missing file is asked for
          # under `/files`, which answers its headers on a 404 as well.
          headers_of() {
            curl --silent --show-error --insecure \
              --resolve logigator.test:443:127.0.0.1 \
              --dump-header - --output /dev/null "$1" | tr -d '\r'
          }
          expect_header() {
            if ! headers_of "$1" | grep --quiet --ignore-case --extended-regexp "^$2"; then
              echo "::error::$1 does not answer $2"
              exit 1
            fi
          }
          for path in /en /editor /api/meta /files/smoke-test.webp; do
            expect_header "$site$path" 'X-Content-Type-Options: nosniff$'
            expect_header "$site$path" 'Referrer-Policy: strict-origin-when-cross-origin$'
            expect_header "$site$path" 'X-Frame-Options: SAMEORIGIN$'
            if headers_of "$site$path" | grep --quiet --ignore-case '^X-Powered-By:'; then
              echo "::error::$site$path names its framework"
              exit 1
            fi
          done
          expect_header "$site/api/meta" "Content-Security-Policy: default-src 'none'; frame-ancestors 'none'$"
          expect_header "$site/files/smoke-test.webp" "Content-Security-Policy: default-src 'none'; sandbox$"
          expect_header "$site/editor" "Content-Security-Policy-Report-Only: .*frame-ancestors 'self'"
          expect_header "$site/en" "Content-Security-Policy-Report-Only: .*'nonce-"

          # Both policies report to the API, which takes a report and answers
          # nothing.
          for path in /en /editor; do
            expect_header "$site$path" "Content-Security-Policy-Report-Only: .*report-uri /api/csp-report; report-to csp"
            expect_header "$site$path" "Reporting-Endpoints: csp=\"$site/api/csp-report\"$"
          done
          status=$(fetch --output /dev/null --write-out '%{http_code}' \
            --header 'Content-Type: application/csp-report' \
            --data '{"csp-report":{"effective-directive":"img-src","blocked-uri":"data"}}' \
            "$site/api/csp-report" || true)
          if [[ $status != 204 ]]; then
            echo "::error::a CSP report is answered $status"
            exit 1
          fi

          # What the edge may keep for a year: a file that exists, under its
          # exact address, since a purge names nothing else. A seeded example's
          # preview is one.
          listing=$(fetch "$site/api/community/projects")
          if [[ ! $listing =~ (/files/preview/[^\"]+\.webp) ]]; then
            echo "::error::the community listing names no preview"
            exit 1
          fi
          preview=${BASH_REMATCH[1]}
          expect_header "$site$preview" 'CDN-Cache-Control: public, max-age=31536000$'
          expect_header "$site$preview" 'Cache-Control: public, max-age=31536000, immutable$'
          expect_header "$site$preview?v=1" 'CDN-Cache-Control: no-store$'
          if headers_of "$site/files/smoke-test.webp" | grep --quiet --ignore-case '^CDN-Cache-Control:'; then
            echo "::error::a missing file under /files is held at the edge"
            exit 1
          fi

      - name: 'Stack logs'
        if: ${{ failure() && needs.pre_job.outputs.skip_stack != 'true' }}
        shell: bash
        run: docker compose logs --no-color
