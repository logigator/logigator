services:
  # Stands in for Cloudflare, as in a local staging run: TLS for logigator.test
  # with Caddy's internal CA, and the one header the origin takes from Cloudflare.
  edge:
    image: caddy:2-alpine
    networks:
      - net
    depends_on:
      - origin
    command: >-
      caddy reverse-proxy --from logigator.test --to origin:8080
      --internal-certs --header-up "Cf-Connecting-Ip: {http.request.remote.host}"
    volumes:
      - caddy_data:/data
    ports:
      - 127.0.0.1:80:80
      - 127.0.0.1:443:443

  # The production origin's Caddyfile, proxying the editor's dev server instead
  # of serving a bundle.
  origin:
    image: caddy:2-alpine
    networks:
      - net
    environment:
      - LOGIGATOR_EDITOR=dev_server
      - CADDY_LOG_LEVEL=${CADDY_LOG_LEVEL:-info}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # What the API writes under STORAGE_DIR, read-only: Caddy serves these
      # files, and only the API ever produces them.
      - ./data/storage:/srv/files:ro

  deps:
    image: node:24
    networks:
      - net
    volumes:
      - ./:/app
    working_dir: /app
    command: "sh -c 'corepack enable && exec yarn'"

  editor:
    image: node:24
    networks:
      - net
    depends_on:
      deps:
        condition: service_completed_successfully
    volumes:
      - ./:/app
    working_dir: /app
    command: "sh -c 'corepack enable && exec yarn start:editor'"

  web:
    image: node:24
    networks:
      - net
    depends_on:
      deps:
        condition: service_completed_successfully
    volumes:
      - ./:/app
    working_dir: /app
    environment:
      - API_ORIGIN=http://api:3000
      - NG_ALLOWED_HOSTS=logigator.test
      - NG_TRUST_PROXY_HEADERS=x-forwarded-host,x-forwarded-proto,x-forwarded-for
    command: "sh -c 'corepack enable && exec yarn start:web'"

  api:
    image: node:24
    networks:
      - net
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app
    working_dir: /app
    ports:
      - 127.0.0.1:3001:3000
    env_file:
      - path: ./logigator-api/.env
        required: false
    command: "sh -c 'corepack enable && yarn workspace logigator-api run db:migrate && exec yarn start:api'"

  postgres:
    image: postgres:18-alpine
    networks:
      - net
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - ./data/postgres:/var/lib/postgresql
    environment:
      - POSTGRES_DB=logigator
      - POSTGRES_USER=logigator
      - POSTGRES_PASSWORD=logigator
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U logigator -d logigator']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    networks:
      - net
    ports:
      - 127.0.0.1:6379:6379
    healthcheck:
      test: ['CMD-SHELL', 'test "$$(redis-cli ping)" = PONG']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caddy_data:

networks:
  net:
    driver: bridge
