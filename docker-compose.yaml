services:
  proxy:
    image: caddy:2-alpine
    networks:
      - net
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      # What the API writes under STORAGE_DIR, read-only: Caddy serves these
      # files, and only the API ever produces them.
      - ./data/storage:/srv:ro
    ports:
      - 127.0.0.1:80:80
      - 127.0.0.1:443:443

  backend:
    image: node:24
    networks:
      - net
    depends_on:
      - mysql
      - redis
    volumes:
      - ./logigator-backend/:/app
    working_dir: /app
    command: "sh -c 'corepack enable && yarn && exec yarn start'"
    environment:
      - DEBUG=express:*
      - DEBUG_COLORS=on

  deps:
    image: node:24
    networks:
      - net
    volumes:
      - ./:/app
    working_dir: /app
    command: "sh -c 'corepack enable && exec yarn'"

  editor:
    image: node:24
    networks:
      - net
    depends_on:
      deps:
        condition: service_completed_successfully
    volumes:
      - ./:/app
    working_dir: /app
    command: "sh -c 'corepack enable && exec yarn start:editor'"

  # The website. Angular SSR, so a Node process rather than a static bundle:
  # every page is rendered per request, in the visitor's language and theme and
  # with their session already resolved.
  web:
    image: node:24
    networks:
      - net
    depends_on:
      deps:
        condition: service_completed_successfully
    volumes:
      - ./:/app
    working_dir: /app
    environment:
      # The server render reaches the API inside the network; the browser
      # reaches it as a path on the same origin.
      - API_ORIGIN=http://api:3000
      # Angular refuses a request whose Host it was not told to expect, and
      # behind Caddy the host and scheme only arrive as forwarded headers —
      # which it likewise only reads once trusted.
      - NG_ALLOWED_HOSTS=logigator.test
      - NG_TRUST_PROXY_HEADERS=x-forwarded-host,x-forwarded-proto
    command: "sh -c 'corepack enable && exec yarn start:web'"

  api:
    image: node:24
    networks:
      - net
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./:/app
    working_dir: /app
    ports:
      - 127.0.0.1:3001:3000
    env_file:
      - path: ./logigator-api/.env
        required: false
    command: "sh -c 'corepack enable && exec yarn start:api'"

  editor-legacy:
    image: node:20
    networks:
      - net
    volumes:
      - ./logigator-editor-legacy/:/app
    working_dir: /app
    command: "sh -c 'corepack enable && yarn && exec yarn start'"

  mysql:
    image: mysql:8.3
    networks:
      - net
    ports:
      - 127.0.0.1:3306:3306
    volumes:
      - ./data/db:/var/lib/mysql
    cap_add:
      - SYS_NICE
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=logigator
      - MYSQL_USER=logigator
      - MYSQL_PASSWORD=logigator

  # The new API's database. MySQL stays for the legacy backend until cutover, so
  # both run side by side and each app talks to its own.
  postgres:
    image: postgres:18-alpine
    networks:
      - net
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - ./data/postgres:/var/lib/postgresql
    environment:
      - POSTGRES_DB=logigator
      - POSTGRES_USER=logigator
      - POSTGRES_PASSWORD=logigator
    # The API probes its connection at startup, so it must not start first.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U logigator -d logigator']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    networks:
      - net
    ports:
      - 127.0.0.1:6379:6379

volumes:
  caddy_data:

networks:
  net:
    driver: bridge
