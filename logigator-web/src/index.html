<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Logigator</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/icons/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/icons/apple-touch-icon.png"
    />
    <link
      rel="mask-icon"
      href="assets/icons/safari-pinned-tab.svg"
      color="#27ae60"
    />
    <link rel="manifest" href="site.webmanifest" />

    <meta name="apple-mobile-web-app-title" content="Logigator" />
    <meta name="application-name" content="Logigator" />
    <meta name="msapplication-TileColor" content="#2b5797" />
    <meta name="theme-color" content="#27ae60" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Logigator" />
    <!--
      The card itself — its URL and its dimensions — is written by `SeoService`,
      per page and against the origin the request arrived at: a published
      document unfurls as its own composed card, everything else as the site's.
    -->
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <web-root></web-root>
    <script src="js/cookieconsent.js" defer></script>
  </body>
</html>
