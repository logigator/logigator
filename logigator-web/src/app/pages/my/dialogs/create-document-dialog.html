<ng-container *webTranslate="let t">
  @let nameMessage = nameError(); @let symbolMessage = symbolError(); @let
  descriptionMessage = descriptionError();

  <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()">
    @if (formError(); as message) {
    <lg-message severity="danger">{{ t(message) }}</lg-message>
    }

    <lg-form-field
      #nameField="lgFormField"
      inputId="create-document-name"
      required
      [label]="t('pages.my.create.nameLabel')"
      [error]="nameMessage ? t(nameMessage) : undefined"
    >
      <input
        lgInputText
        id="create-document-name"
        type="text"
        class="w-full"
        maxlength="20"
        formControlName="name"
        [invalid]="!!nameMessage"
        [attr.aria-describedby]="nameField.describedBy()"
      />
    </lg-form-field>

    @if (isComponent) {
    <lg-form-field
      #symbolField="lgFormField"
      inputId="create-document-symbol"
      required
      [label]="t('pages.my.create.symbolLabel')"
      [hint]="t('pages.my.create.symbolHint')"
      [error]="symbolMessage ? t(symbolMessage) : undefined"
    >
      <input
        lgInputText
        id="create-document-symbol"
        type="text"
        class="w-full font-mono"
        maxlength="5"
        formControlName="symbol"
        [invalid]="!!symbolMessage"
        [attr.aria-describedby]="symbolField.describedBy()"
      />
    </lg-form-field>
    }

    <lg-form-field
      #descriptionField="lgFormField"
      inputId="create-document-description"
      [label]="t('pages.my.create.descriptionLabel')"
      [hint]="t('pages.my.edit.descriptionHint')"
      [error]="descriptionMessage ? t(descriptionMessage) : undefined"
    >
      <lg-markdown-field
        [value]="description()"
        [maxLength]="2048"
        [labelledBy]="descriptionField.labelId()"
        [describedBy]="descriptionField.describedBy()"
        [invalid]="!!descriptionMessage"
      >
        <textarea
          lgTextarea
          id="create-document-description"
          rows="6"
          class="w-full"
          maxlength="2048"
          formControlName="description"
          [invalid]="!!descriptionMessage"
          [attr.aria-describedby]="descriptionField.describedBy()"
        ></textarea>
      </lg-markdown-field>
    </lg-form-field>

    <!-- The share dialog's picker, at the step it takes there, so the control
         that sets a state and the one that changes it later look alike. -->
    <div class="flex flex-col gap-2">
      <span
        id="create-document-visibility"
        class="text-sm font-medium text-text-hover"
      >
        {{ t('pages.my.share.visibilityLabel') }}
      </span>
      <lg-select-button
        fluid
        size="sm"
        optionLabel="label"
        optionValue="value"
        ariaLabelledby="create-document-visibility"
        [allowEmpty]="false"
        [options]="states()"
        [ngModel]="visibility()"
        [ngModelOptions]="{ standalone: true }"
        (ngModelChange)="visibility.set($event)"
      />
      <p class="text-sm leading-relaxed text-muted">{{ stateHint() }}</p>
    </div>

    <div class="flex justify-end gap-2">
      <button
        lgButton
        outlined
        severity="secondary"
        type="button"
        (click)="cancel()"
      >
        {{ t('pages.my.create.cancel') }}
      </button>
      <button lgButton type="submit" [loading]="saving()">
        {{ t('pages.my.create.submit') }}
      </button>
    </div>
  </form>
</ng-container>
