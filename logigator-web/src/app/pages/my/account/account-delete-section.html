<web-account-section
  *webTranslate="let t"
  class="[&>section]:border-error-border [&>section]:bg-error-surface"
  [heading]="t('pages.my.account.delete.heading')"
  [description]="t('pages.my.account.delete.description')"
>
  @let passwordMessage = passwordError();

  <div class="flex max-w-sm flex-col gap-4">
    @if (formError(); as message) {
    <lg-message severity="danger">{{ t(message) }}</lg-message>
    } @if (reauthenticate()) {
    <lg-message severity="info">
      {{ t('pages.my.account.delete.reauthenticate') }}
    </lg-message>
    <div>
      <!-- A plain link: the round trip leaves the app for the API and Google. -->
      <a lgButton outlined severity="secondary" [href]="reauthenticateUrl()">
        {{ t('auth.continueWithGoogle') }}
      </a>
    </div>
    } @if (needsPassword()) {
    <lg-form-field
      #passwordField="lgFormField"
      inputId="account-delete-password"
      required
      [label]="t('pages.my.account.currentPassword')"
      [error]="passwordMessage ? t(passwordMessage) : undefined"
    >
      <input
        lgInputText
        id="account-delete-password"
        type="password"
        autocomplete="current-password"
        class="w-full"
        [formControl]="password"
        [invalid]="!!passwordMessage"
        [attr.aria-describedby]="passwordField.describedBy()"
      />
    </lg-form-field>
    } @if (!reauthenticate()) {
    <div>
      <button
        lgButton
        severity="danger"
        type="button"
        [loading]="deleting()"
        (onClick)="confirm()"
      >
        {{ t('pages.my.account.delete.submit') }}
      </button>
    </div>
    }
  </div>
</web-account-section>
