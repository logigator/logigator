<ng-container *webTranslate="let t">
  <header class="page-wrap pt-10 pb-8 md:pt-14 md:pb-10">
    <h1
      class="text-2xl leading-tight font-bold tracking-[-0.01em] text-balance text-text-hover md:text-[32px]"
    >
      {{ t('pages.changelog.title') }}
    </h1>
    <p
      class="mt-3 max-w-[62ch] text-[17px] leading-relaxed text-pretty text-muted"
    >
      {{ t('pages.changelog.lede') }}
    </p>
    <!-- A plain href, not a routerLink: the feed is XML the server writes, not
         a page this app renders. -->
    <a
      class="mt-5 inline-flex items-center gap-1.5 text-sm text-muted transition-colors hover:text-text-hover"
      [href]="feedHref()"
    >
      <i class="ph ph-rss-simple text-base" aria-hidden="true"></i>
      <span>{{ t('pages.changelog.feed') }}</span>
    </a>
  </header>

  <div class="page-wrap pb-14 md:pb-20">
    @for (release of releases(); track release.version) {
    <section
      class="grid gap-2 border-t border-border py-8 md:py-10 lg:grid-cols-[minmax(0,14rem)_minmax(0,1fr)] lg:gap-12"
    >
      <div class="lg:sticky lg:top-20 lg:self-start">
        <h2
          class="font-mono text-xl font-bold text-text-hover"
          [id]="release.version"
        >
          {{ release.version }}
        </h2>
        <time class="text-sm text-muted" [attr.datetime]="release.date">
          {{ release.dateLabel }}
        </time>
      </div>

      <lg-markdown class="min-w-0" [data]="release.body" />
    </section>
    }
  </div>
</ng-container>
