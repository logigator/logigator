<ng-container *webTranslate="let t">
  <header class="page-wrap pt-10 pb-8 md:pt-14 md:pb-10">
    <h1
      class="text-2xl leading-tight font-bold tracking-[-0.01em] text-balance text-text-hover md:text-[32px]"
    >
      {{ t('pages.docs.title') }}
    </h1>
    <p
      class="mt-3 max-w-[62ch] text-[17px] leading-relaxed text-pretty text-muted"
    >
      {{ t('pages.docs.lede') }}
    </p>
    <web-docs-search-field class="mt-6 block max-w-md" [live]="true" />
  </header>

  <div class="page-wrap pb-14 md:pb-20">
    @if (search.searching() && !search.loading()) {
    <web-docs-search-results class="block border-t border-border" />
    } @else { @for (section of sections; track section.id) {
    <!-- The rule under the header, as the first row's border is on the
           pages that carry rows. -->
    <section
      class="grid gap-4 border-t border-border py-7 md:gap-8 md:py-9 lg:grid-cols-[minmax(0,14rem)_minmax(0,1fr)]"
    >
      <h2 class="text-lg font-medium text-text-hover">
        {{ t(sectionTitles[section.id]) }}
      </h2>
      <ul class="grid gap-x-8 gap-y-3 sm:grid-cols-2">
        @for (page of section.pages; track page) {
        <li>
          <a
            class="inline-flex items-center gap-1.5 text-text transition-colors hover:text-primary"
            [routerLink]="hrefs()[page]"
          >
            <i
              class="ph ph-file-text text-base text-muted"
              aria-hidden="true"
            ></i>
            <span>{{ t(pageTitles[page]) }}</span>
          </a>
        </li>
        }
      </ul>
    </section>
    } }
  </div>
</ng-container>
