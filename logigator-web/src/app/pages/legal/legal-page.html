<ng-container *webTranslate="let t">
  <header class="page-wrap pt-10 pb-8 md:pt-14 md:pb-10">
    <h1
      class="text-2xl leading-tight font-bold tracking-[-0.01em] text-balance text-text-hover md:text-[32px]"
    >
      {{ t(headings.title) }}
    </h1>
    <p
      class="mt-3 max-w-[62ch] text-[17px] leading-relaxed text-pretty text-muted"
    >
      {{ t(headings.lede) }}
    </p>
  </header>

  <div class="page-wrap pb-14 md:pb-20">
    @if (markdown(); as document) {
    <!-- The rule under the header, as the first row's border is on the pages
         that carry rows. -->
    <lg-markdown
      class="border-t border-border pt-8 md:pt-10"
      [data]="document"
    />
    }
  </div>
</ng-container>
