<footer class="border-t border-border bg-content" *webTranslate="let t">
  <div
    class="page-wrap flex flex-wrap items-center gap-x-6 gap-y-2 py-6 text-sm text-muted"
  >
    <a class="hover:text-text" [routerLink]="links.privacyPolicy()"
      >{{ t('footer.privacyPolicy') }}</a
    >
    <a class="hover:text-text" [routerLink]="links.imprint()"
      >{{ t('footer.imprint') }}</a
    >
    <a
      class="hover:text-text"
      target="_blank"
      rel="noopener"
      [href]="links.repository"
      >{{ t('footer.contributing') }}</a
    >
  </div>
</footer>
